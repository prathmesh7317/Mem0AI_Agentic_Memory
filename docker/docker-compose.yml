services:
  mem0-app:
    image: mem0-app-${ENV_NAME:-dev}:${APP_VERSION:-latest}
    container_name: mem0-app-${ENV_NAME:-dev}
    depends_on:
      - redis
      - neo4j
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - APP_VERSION=${APP_VERSION:-latest}
        - ENV_NAME=${ENV_NAME:-dev}
        - APP_PORT=${APP_PORT:-5000}
    ports:
      - "${APP_PORT:-5000}:${APP_PORT:-5000}"
    env_file:
      - ../.env
    environment:
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_MESSAGE_HISTORY_NAME: "${REDIS_MESSAGE_HISTORY_NAME:-mem0:history}"
      NEO4J_URL: "${NEO4J_URL:-bolt://neo4j:7687}"
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-password123}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
    volumes:
      - ../logs:/app/logs
    restart: unless-stopped
    command: >
      uv run main.py
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mem0-app-network


  neo4j:
    image: neo4j:latest
    container_name: neo4j-${ENV_NAME:-dev}
    restart: always
    ports:
      - "7475:7474"   # HTTP access (Neo4j Browser)
      - "7688:7687"   # Bolt protocol (for drivers, APIs)
    environment:
      - NEO4J_AUTH=neo4j/password123        # username/password
      - NEO4J_dbms_memory_pagecache_size=1G # optional tuning
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    networks:
      - mem0-app-network


  redis:
    image: redis/redis-stack:latest
    container_name: redis-${ENV_NAME:-dev}
    environment:
      - REDIS_ARGS=--save 60 1 --loglevel warning
    ports:
      - "6311:6379"
      - "8008:8001"   # Redis Stack browser UI
    volumes:
      - redis_data:/data
    networks:
      - mem0-app-network

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  redis_data:

networks:
  mem0-app-network:
    name: mem0-app-network
    driver: bridge